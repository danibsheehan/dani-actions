name: Auto-bump self reference

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine latest dani-actions tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/danibsheehan/dani-actions/tags --jq '.[0].name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sweep dani-actions references to the latest tag
        env:
          NEW_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          sed -i -E "s#(danibsheehan/dani-actions/\.github/(actions|workflows)/[^@]+)@v[0-9]+#\1@${NEW_TAG}#g" .github/workflows/*.yml

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and auto-merge bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          branch="chore/dani-actions-bump-${NEW_TAG}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          git commit -m "Bump danibsheehan/dani-actions references to ${NEW_TAG}"
          git push -u origin "$branch"
          pr_url=$(gh pr create \
            --title "Bump danibsheehan/dani-actions references to ${NEW_TAG}" \
            --body "Automated bump of all danibsheehan/dani-actions pins to the latest published tag (${NEW_TAG}).")
          gh pr merge --auto --squash "$pr_url"
