name: Auto-tag release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-tag]') }}
    outputs:
      tagged: ${{ steps.check-label.outputs.should-tag }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release label
        id: check-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr_number=$(echo "$COMMIT_MESSAGE" | head -1 | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+')
          if [ -z "$pr_number" ]; then
            echo "No PR number found in commit message; skipping tag." >&2
            echo "should-tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_label=$(gh pr view "$pr_number" --json labels --jq '[.labels[].name] | any(. == "release")')
          echo "should-tag=$has_label" >> "$GITHUB_OUTPUT"

      - name: Compute next tag
        id: next
        if: steps.check-label.outputs.should-tag == 'true'
        run: |
          latest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=1
          else
            next=$((latest + 1))
          fi
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check-label.outputs.should-tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  sweep-self-refs:
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Sweep self-referenced pins to the new tag
        run: |
          sed -i -E "s#(danibsheehan/dani-actions/\.github/(actions|workflows)/[^@]+)@v[0-9]+#\1@${NEW_TAG}#g" .github/workflows/*.yml

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and merge sweep PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="chore/self-ref-sweep-${NEW_TAG}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          git commit -m "Sweep self-referenced dani-actions pins to ${NEW_TAG}"
          git push -u origin "$branch"
          # Title carries [skip-tag] (checked by the `tag` job's guard above) so this
          # PR's squash-merge commit doesn't trigger another tag once it lands on main.
          # No `release` label is applied, for the same reason.
          pr_url=$(gh pr create \
            --title "Sweep self-referenced dani-actions pins to ${NEW_TAG} [skip-tag]" \
            --body "Automated sweep of all self-referenced danibsheehan/dani-actions pins to ${NEW_TAG}, per the repo's versioning policy.")
          # main has no required status checks configured, so there's nothing to wait
          # on -- merge immediately. If required checks are ever added to the ruleset,
          # switch this to: gh pr merge --auto --squash "$pr_url"
          gh pr merge --squash "$pr_url"
