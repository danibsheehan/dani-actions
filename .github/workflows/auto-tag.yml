name: Auto-tag release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-tag]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release label
        id: check-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr_number=$(echo "$COMMIT_MESSAGE" | head -1 | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+')
          if [ -z "$pr_number" ]; then
            echo "No PR number found in commit message; skipping tag." >&2
            echo "should-tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_label=$(gh pr view "$pr_number" --json labels --jq '[.labels[].name] | any(. == "release")')
          echo "should-tag=$has_label" >> "$GITHUB_OUTPUT"

      - name: Compute next tag
        id: next
        if: steps.check-label.outputs.should-tag == 'true'
        run: |
          latest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=1
          else
            next=$((latest + 1))
          fi
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check-label.outputs.should-tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
