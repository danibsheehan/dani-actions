# Auto-merges the grouped npm-minor-and-patch Dependabot PRs, grouped
# security-update PRs at patch/minor level, and the danibsheehan/dani-actions
# self-reference specifically, once required checks pass. The dani-actions
# exception is safe because every tag is cumulative and non-breaking by this
# repo's own versioning policy. Security-update groups can't be filtered by
# update-types in dependabot.yml (that only applies to version-update
# groups), so major-level security bumps are excluded here instead, via the
# update-type check below. All other ungrouped npm majors, gomod, and
# github-actions bumps stay manual since they carry more upgrade risk.
name: Dependabot auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for npm-minor-and-patch, security patch/minor, and dani-actions self-ref
        if: >-
          steps.metadata.outputs.dependency-group == 'npm-minor-and-patch' ||
          contains(steps.metadata.outputs.dependency-names, 'danibsheehan/dani-actions') ||
          (steps.metadata.outputs.dependency-group == 'security-updates' &&
           (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
