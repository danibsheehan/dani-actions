# Reusable Cloudflare Pages build+deploy, symmetric to deploy-github-pages.yml -- same input
# shape (build-command/dist-path/node-version-file, generic build-secret-1/2/3 passthrough)
# with the publish step and auth model swapped for Cloudflare's (an API token + account ID,
# not GitHub's own Pages OIDC). Kept as a separate reusable workflow rather than merged into
# deploy-github-pages.yml with a provider switch: the two hosts need genuinely different
# actions and credential models, so one file per host stays simpler than one file branching
# on a "which host" input.
name: Deploy to Cloudflare Pages

on:
  workflow_call:
    inputs:
      build-command:
        description: "Shell command that produces the production build (e.g. 'npm run build')"
        required: true
        type: string
      dist-path:
        description: "Path to the built output to publish (e.g. 'dist')"
        required: true
        type: string
      project-name:
        description: "Cloudflare Pages project name (must already exist in Cloudflare)"
        required: true
        type: string
      node-version-file:
        description: "Path to a Node version file (e.g. .nvmrc) to read the version from"
        required: false
        type: string
        default: ".nvmrc"
      working-directory:
        description: "Directory to build from (e.g. 'frontend' for a monorepo-style layout)"
        required: false
        type: string
        default: "."
      site-public-url:
        description: "Optional custom domain for a soft smoke check (never fails the deploy -- custom domains often hit bot challenges from Actions' curl)"
        required: false
        type: string
        default: ""
      production-keep-count:
        description: >-
          Most-recent production deployments to keep. Cloudflare Pages never expires a
          deployment's own hash URL on its own, so without this, every past production build
          (broken ones included) stays reachable forever.
        required: false
        type: number
        default: 5
    secrets:
      cloudflare-api-token:
        required: true
      cloudflare-account-id:
        required: true
      build-secret-1:
        required: false
      build-secret-2:
        required: false
      build-secret-3:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate configuration
        env:
          CF_TOKEN: ${{ secrets.cloudflare-api-token }}
          CF_ACCOUNT: ${{ secrets.cloudflare-account-id }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "${{ inputs.project-name }}" ]; then
            echo "::error::deploy-cloudflare-pages.yml: cloudflare-api-token, cloudflare-account-id secrets and project-name input are all required"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - name: Build
        env:
          BUILD_SECRET_1: ${{ secrets.build-secret-1 }}
          BUILD_SECRET_2: ${{ secrets.build-secret-2 }}
          BUILD_SECRET_3: ${{ secrets.build-secret-3 }}
        run: ${{ inputs.build-command }}

      - id: pages
        name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.cloudflare-api-token }}
          accountId: ${{ secrets.cloudflare-account-id }}
          projectName: ${{ inputs.project-name }}
          directory: ${{ inputs.dist-path }}
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: ${{ inputs.working-directory }}

      # Hard-check the *.pages.dev deployment URL -- custom domains often hit Cloudflare bot
      # challenges (403 + cf-mitigated: challenge) from Actions' curl, so a custom domain only
      # gets a soft, never-failing check below.
      - name: Smoke check Pages
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
          CF_PROJECT: ${{ inputs.project-name }}
        run: |
          URL="${PAGES_URL:-https://${CF_PROJECT}.pages.dev}"
          URL="${URL%/}"
          echo "Checking ${URL}/…"
          ok=0
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/pages-body -w '%{http_code}' --max-time 15 "${URL}/" || true)
            if [ "$code" = "200" ]; then
              echo "OK / (attempt ${i})"
              ok=1
              break
            fi
            echo "attempt ${i}: HTTP ${code}"
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Pages smoke ${URL}/ did not return HTTP 200 after retries"
            exit 1
          fi
          if [ -n "${{ inputs.site-public-url }}" ]; then
            SITE="${{ inputs.site-public-url }}"
            SITE="${SITE%/}"
            site_code=$(curl -sS -o /tmp/site-body -w '%{http_code}' --max-time 15 "${SITE}/" || true)
            if [ "$site_code" = "200" ]; then
              echo "OK soft check ${SITE}/ → 200"
            else
              echo "::warning::site-public-url ${SITE}/ returned HTTP ${site_code} (often Cloudflare bot challenge). Upload smoke used ${URL}/ instead."
            fi
          fi

      # Cloudflare never expires a deployment's own hash URL on its own -- every past
      # production build stays reachable forever unless explicitly deleted. Runs only after
      # the smoke check above confirms the NEW deploy is good, so a prune never touches
      # anything before the replacement is verified live. Deliberately non-fatal (::warning::
      # not exit 1): unlike pages-preview-cleanup.yml (whose only job is cleanup), this is a
      # secondary concern bolted onto a deploy job whose primary purpose already succeeded --
      # a Cloudflare API hiccup here shouldn't mark an otherwise-good deploy as failed.
      - name: Prune old production deployments
        env:
          CF_TOKEN: ${{ secrets.cloudflare-api-token }}
          CF_ACCOUNT: ${{ secrets.cloudflare-account-id }}
          CF_PROJECT: ${{ inputs.project-name }}
          KEEP_COUNT: ${{ inputs.production-keep-count }}
        run: |
          list_production_deployments() {
            local page=1 total_pages resp
            local -a lines=() page_lines=()
            while true; do
              if ! resp=$(curl -sS -f \
                -H "Authorization: Bearer $CF_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}/deployments?env=production&page=${page}&per_page=25"); then
                echo "::warning::Failed to list Cloudflare Pages production deployments (page $page); skipping prune this run."
                return 1
              fi
              mapfile -t page_lines < <(echo "$resp" | jq -r '
                .result[]
                | select(.environment == "production")
                | "\(.created_on)\t\(.id)\t\(.url)"
              ')
              if [ "${#page_lines[@]}" -gt 0 ]; then
                lines+=("${page_lines[@]}")
              fi
              total_pages=$(echo "$resp" | jq -r '.result_info.total_pages // 1')
              if [ "$page" -ge "$total_pages" ]; then
                break
              fi
              page=$((page + 1))
            done
            if [ "${#lines[@]}" -gt 0 ]; then
              printf '%s\n' "${lines[@]}"
            fi
          }

          if ! raw=$(list_production_deployments); then
            exit 0
          fi
          all_lines=()
          if [ -n "$raw" ]; then
            mapfile -t all_lines <<< "$raw"
          fi

          # created_on is ISO 8601, so lexicographic sort is also chronological.
          mapfile -t sorted_lines < <(printf '%s\n' "${all_lines[@]}" | sort -r)
          to_delete=("${sorted_lines[@]:$KEEP_COUNT}")

          if [ "${#to_delete[@]}" -eq 0 ]; then
            echo "Nothing to prune (${#sorted_lines[@]} production deployment(s), keeping ${KEEP_COUNT})."
            exit 0
          fi

          echo "Pruning ${#to_delete[@]} production deployment(s) beyond the ${KEEP_COUNT} most recent…"
          declare -A deleted_urls=()
          for line in "${to_delete[@]}"; do
            id=$(echo "$line" | cut -f2)
            url=$(echo "$line" | cut -f3)
            deleted_urls["$url"]=1
            echo "Deleting $id ($url)"
            curl -sS -X DELETE \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}/deployments/${id}?force=true" \
              >/dev/null || echo "::warning::Delete request for $id failed; will re-check by URL."
          done

          for attempt in 1 2 3; do
            still_live=()
            for url in "${!deleted_urls[@]}"; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                still_live+=("$url")
              fi
            done
            if [ "${#still_live[@]}" -eq 0 ]; then
              echo "Confirmed all pruned URLs are gone."
              exit 0
            fi
            echo "${#still_live[@]} pruned URL(s) still responding after attempt ${attempt}: ${still_live[*]}"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::warning::${#still_live[@]} pruned URL(s) still responding after retries: ${still_live[*]} (Cloudflare's own bookkeeping can lag; not failing the deploy for this)"

      - name: Deploy summary
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
          CF_PROJECT: ${{ inputs.project-name }}
        run: |
          PAGES="${PAGES_URL:-https://${CF_PROJECT}.pages.dev}"
          {
            echo "## Deploy summary (${{ inputs.project-name }})"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **git SHA** | \`${{ github.sha }}\` |"
            echo "| **Pages (smoke)** | ${PAGES} |"
            echo "| **SPA smoke** | \`GET /\` on Pages URL → 200 |"
          } >> "$GITHUB_STEP_SUMMARY"
