# Reusable npm CI quality gate: format/lint/audit/test/build. The exact command set
# (format:check, lint, test:coverage or equivalent, build) was confirmed identical across
# multiple consuming repos before this was built -- this isn't a guess at what they share.
#
# format:check and `npm ci` always run; lint/audit/test/build can be skipped on
# docs-only PRs via the optional app-paths path filter (offered to every caller, not
# built for just one). The job is always named `quality` so the required check name is
# consistent across every repo that adopts this.
name: npm quality gate

on:
  workflow_call:
    inputs:
      node-version-file:
        description: "Path to a Node version file (e.g. .nvmrc) to read the version from"
        required: false
        type: string
        default: ".nvmrc"
      test-command:
        description: "Shell command that runs the test suite with coverage"
        required: false
        type: string
        default: "npm run test:coverage"
      build-command:
        description: "Shell command that produces the production build"
        required: false
        type: string
        default: "npm run build"
      run-audit:
        description: "Run npm audit --audit-level=high"
        required: false
        type: boolean
        default: true
      stack-docs-command:
        description: "Optional command that checks README/AGENTS.md stack claims against the real manifest (e.g. a check_stack_docs.py). Skipped if empty."
        required: false
        type: string
        default: ""
      skip-covered:
        description: "Hide 100%-covered files from the Cobertura PR comment table"
        required: false
        type: boolean
        default: true
      coverage-file:
        description: "Path to the Cobertura coverage XML file produced by test-command"
        required: false
        type: string
        default: "coverage/cobertura-coverage.xml"
      coverage-thresholds:
        description: "Space-separated 'yellow red' thresholds for the coverage summary badge"
        required: false
        type: string
        default: "50 75"
      app-paths:
        description: >-
          Optional full dorny/paths-filter `filters:` YAML block, including the `app:` key
          itself (e.g. "app:\n  - 'src/**'\n  - 'package.json'"). When set, lint/audit/
          test/build are skipped on pull requests that touch none of these paths
          (format:check and npm ci always run regardless). Leave empty to always run
          everything.
        required: false
        type: string
        default: ""
      setup-chrome:
        description: "Install a real Chrome browser before running tests (needed by some test runners, e.g. Angular's)"
        required: false
        type: boolean
        default: false
    secrets:
      # Generic pass-through slots, same as deploy-github-pages.yml, for a build/test
      # command that needs a secret value baked in.
      build-secret-1:
        required: false
      build-secret-2:
        required: false
      build-secret-3:
        required: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect app vs docs-only changes
        if: inputs.app-paths != '' && github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ inputs.app-paths }}

      - name: Stack docs vs manifests
        if: inputs.stack-docs-command != ''
        run: ${{ inputs.stack-docs-command }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Set up Chrome
        if: inputs.setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: setup-chrome

      - run: npm ci

      - name: npm audit (high+)
        if: inputs.run-audit && (inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true')
        run: npm audit --audit-level=high

      - name: Lint
        if: inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true'
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        if: inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true'
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          BUILD_SECRET_1: ${{ secrets.build-secret-1 }}
          BUILD_SECRET_2: ${{ secrets.build-secret-2 }}
          BUILD_SECRET_3: ${{ secrets.build-secret-3 }}
        run: ${{ inputs.test-command }}

      - name: Cobertura markdown summary (for job summary)
        if: inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ${{ inputs.coverage-file }}
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: ${{ inputs.coverage-thresholds }}

      - name: Add coverage to GitHub Actions job summary
        if: inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true'
        run: |
          echo "## Code coverage (Cobertura)" >> "$GITHUB_STEP_SUMMARY"
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # Same-repo PRs only: forked PR workflows get a read-only token and cannot post
      # comments on the base repo PR.
      - name: Cobertura coverage comment on PR
        if: >
          (inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true') &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
        with:
          path: ${{ inputs.coverage-file }}
          minimum_coverage: 0
          fail_below_threshold: false
          show_line: true
          show_branch: true
          skip_covered: ${{ inputs.skip-covered }}
          report_name: Unit tests

      - name: Build
        if: inputs.app-paths == '' || github.event_name != 'pull_request' || steps.filter.outputs.app == 'true'
        env:
          BUILD_SECRET_1: ${{ secrets.build-secret-1 }}
          BUILD_SECRET_2: ${{ secrets.build-secret-2 }}
          BUILD_SECRET_3: ${{ secrets.build-secret-3 }}
        run: ${{ inputs.build-command }}
