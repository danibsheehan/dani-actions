# TEMPORARY validation workflow -- exercises pr-guide-engine's real runtime mechanics
# (action_path resolution, pip install, file I/O, GITHUB_OUTPUT) in an actual GitHub Actions
# runner, since pull_request_target always uses the BASE branch's workflow file, making the
# real pr-guide.yml impossible to validate via a real PR from a feature branch. Deleted once
# validated.
name: TMP validate pr-guide-engine

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch caught-looking's real config
        run: |
          curl -sSL -o pr-guide-areas.yml \
            "https://raw.githubusercontent.com/danibsheehan/caught-looking/feat/pr-guide-engine-config/.github/pr-guide-areas.yml"
          cat pr-guide-areas.yml

      - name: Build synthetic inputs
        run: |
          printf "backend/apidocs/openapi.yaml\nbackend/handlers/foo.go\nfrontend/src/App.tsx\n.github/workflows/verify.yml\n" > changed-files.txt
          printf "" > current-body.md

      - name: Run engine (mode=body, empty body)
        id: body
        uses: ./.github/actions/pr-guide-engine
        with:
          mode: body
          config-file: pr-guide-areas.yml
          changed-paths-file: changed-files.txt
          current-body-file: current-body.md
          result-file: new-body.md

      - name: Show body result
        run: |
          echo "update output: ${{ steps.body.outputs.update }}"
          echo "--- new-body.md ---"
          cat new-body.md

      - name: Run engine (mode=guide)
        env:
          GITHUB_REPO_URL: https://github.com/danibsheehan/caught-looking
          DIFF_SHORTSTAT: " 4 files changed, 30 insertions(+), 5 deletions(-)"
          COMMIT_LINES: |
            abc1234 fix: something
            def5678 feat: another thing
        uses: ./.github/actions/pr-guide-engine
        with:
          mode: guide
          config-file: pr-guide-areas.yml
          changed-paths-file: changed-files.txt
          result-file: pr-guide.md

      - name: Show guide result
        run: cat pr-guide.md

      - name: Run engine again on the scaffolded body (should merge, not re-scaffold)
        id: body2
        run: cp new-body.md current-body-2.md
        shell: bash

      - uses: ./.github/actions/pr-guide-engine
        id: body2_run
        with:
          mode: body
          config-file: pr-guide-areas.yml
          changed-paths-file: changed-files.txt
          current-body-file: current-body-2.md
          result-file: new-body-2.md

      - name: Show second-pass merge result
        run: |
          echo "update output: ${{ steps.body2_run.outputs.update }}"
          cat new-body-2.md 2>/dev/null || echo "(no update -- file not written, as expected if body unchanged)"
